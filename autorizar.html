<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Autorizar alunos</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 20px 14px; }
      main { width: min(100%, 620px); display: grid; gap: 14px; } header, section { background: #fff; border: 1px solid #e3e8f0; border-radius: 18px; padding: 20px; box-shadow: 0 8px 28px #1720330d; }
      h1, h2, p { margin: 0; } h1 { font-size: 22px; } h2 { font-size: 16px; } p, small { color: #667085; line-height: 1.45; }
      form { display: grid; gap: 10px; } label { display: grid; gap: 6px; color: #344054; font-size: 13px; font-weight: 650; } input, button { min-height: 46px; border-radius: 11px; font: inherit; } input { border: 1px solid #cfd7e3; padding: 0 12px; font-size: 16px; } button { border: 0; padding: 0 16px; color: #fff; background: #2563eb; font-weight: 700; cursor: pointer; } button:disabled { opacity: .6; cursor: default; }
      #status { min-height: 21px; font-size: 13px; } .list { display: grid; gap: 10px; margin-top: 14px; } article { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px; border: 1px solid #e3e8f0; border-radius: 13px; } article > div { display: grid; gap: 3px; } article button { min-height: 40px; white-space: nowrap; } .empty { padding: 18px 0; }
      @media (max-width: 500px) { body { padding: 12px 10px; } header, section { padding: 16px; border-radius: 15px; } article { align-items: stretch; flex-direction: column; } article button { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <header><div><h1>Autorizar alunos</h1><p>Confirme rapidamente quem indicou presença. Esta tela não abre o painel completo.</p></div></header>
      <section id="loginSection"><form id="quickLoginForm"><label>PIN do professor<input id="quickPin" type="password" inputmode="numeric" autocomplete="current-password" required /></label><button type="submit">Entrar</button></form><p id="status" role="status" aria-live="polite"></p></section>
      <section id="pendingSection" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><h2>Indicações pendentes</h2><small id="updatedAt"></small></div><button type="button" id="refreshButton">Atualizar</button></div><div class="list" id="pendingList"></div></section>
    </main>
    <script src="authorize-fast.js"></script>
  </body>
</html>
