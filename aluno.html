<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Agenda do aluno</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 20px 14px; }
      main { width: min(100%, 520px); display: grid; gap: 14px; }
      header, section { background: #fff; border: 1px solid #e3e8f0; border-radius: 18px; padding: 20px; box-shadow: 0 8px 28px #1720330d; }
      header { display: flex; align-items: center; gap: 12px; }
      header img { width: 48px; height: 48px; object-fit: contain; border-radius: 12px; }
      h1, h2, p { margin: 0; } h1 { font-size: 22px; } h2 { font-size: 17px; } p { color: #667085; line-height: 1.45; }
      form { display: grid; gap: 10px; } label { display: grid; gap: 6px; color: #344054; font-size: 13px; font-weight: 650; }
      input, button { min-height: 46px; border-radius: 11px; font: inherit; } input { border: 1px solid #cfd7e3; padding: 0 12px; font-size: 16px; }
      button { border: 0; padding: 0 16px; color: #fff; background: #2563eb; font-weight: 700; cursor: pointer; } button:disabled { opacity: .6; cursor: default; }
      #status { min-height: 21px; font-size: 13px; } .list { display: grid; gap: 10px; margin-top: 14px; }
      article { display: grid; gap: 10px; padding: 14px; border: 1px solid #e3e8f0; border-radius: 13px; } article strong { font-size: 15px; } article small { color: #667085; }
      article button { width: 100%; } .done { color: #067647; font-weight: 700; font-size: 13px; }
      @media (max-width: 420px) { body { padding: 12px 10px; } header, section { padding: 16px; border-radius: 15px; } }
    </style>
  </head>
  <body>
    <main>
      <header><img src="assets/team-lucao-logo.png" alt="" /><div><h1>Agenda do aluno</h1><p>Veja suas aulas ou escolha um horário regular nesta semana.</p></div></header>
      <section>
        <form id="studentFastForm"><label>Seu WhatsApp<input id="studentFastPhone" inputmode="tel" autocomplete="tel" placeholder="(15) 99999-9999" required /></label><button type="submit">Ver minhas aulas</button></form>
        <p id="studentFastStatus" role="status" aria-live="polite"></p>
        <div class="list" id="studentFastList"></div>
      </section>
    </main>
    <script src="student-fast.js"></script>
  </body>
</html>
