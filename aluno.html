<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Agenda do aluno</title>
    <script>try{document.documentElement.dataset.theme=String(localStorage.getItem('fv_theme')||'').toLowerCase().endsWith('dark')?'dark':'light'}catch{}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="public.css?v=20260908-ui2" />
  </head>
  <body>
    <main class="fast-shell">
      <nav class="fast-nav" aria-label="Navegação"><a class="back-link" href="/">← Página inicial</a><button class="theme-switch" type="button" data-theme-toggle aria-label="Usar modo escuro"></button></nav>
      <header class="fast-hero"><span class="fast-logo"><img src="assets/team-lucao-logo.png" alt="" /></span><div><p class="eyebrow">acesso do aluno</p><h1>Minha agenda</h1><p>Consulte aulas e confirme sua presença em poucos segundos.</p></div></header>
      <section class="fast-panel">
        <div class="section-heading"><p class="eyebrow">consulta rápida</p><h2>Encontre suas aulas</h2><p>Digite o mesmo WhatsApp usado no seu cadastro.</p></div>
        <form id="studentFastForm"><label>Seu WhatsApp<input id="studentFastPhone" inputmode="tel" autocomplete="tel" placeholder="(15) 99999-9999" maxlength="15" required /></label><button class="primary-button" type="submit">Ver minhas aulas</button><small class="privacy-note">Usamos o número somente para localizar sua agenda.</small></form>
        <p id="studentFastStatus" role="status" aria-live="polite"></p>
        <div class="filters" id="studentFastFilters" hidden>
          <label>Data<select id="studentFastDate"><option value="">Todas as datas</option></select></label>
          <label>Hora<select id="studentFastTime"><option value="">Todos os horários</option></select></label>
        </div>
        <div class="list" id="studentFastList" aria-live="polite"></div>
      </section>
      <footer class="fast-footer">Team Lucão Futevôlei · Agenda online</footer>
    </main>
  <script src="public-theme.js?v=20260908-ui2"></script>
  <script src="student-fast.js?v=20260908-ui2"></script>
  </body>
</html>
